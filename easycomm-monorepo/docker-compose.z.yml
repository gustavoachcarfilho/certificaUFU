services:
  zookeeper:
      image: 'confluentinc/cp-zookeeper:7.5.0'
      container_name: backup-zookeeper
      ports:
        - '2181:2181'
      volumes:
        - backup-zookeeper:/var/lib/zookeeper/data
      environment:
        ZOOKEEPER_CLIENT_PORT: 2181
        ZOOKEEPER_TICK_TIME: 2000
        ZOOKEEPER_SYNC_LIMIT: 2
      networks:
        - easycomm-net
      healthcheck:
        test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s

networks:
  easycomm-net:
    driver: bridge

volumes:
  backup-zookeeper:
    name: backup-zookeeper
  backup-kafka:
    name: backup-kafka